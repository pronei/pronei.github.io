# Extended notes appended to /llms-full.txt — depth for AI assistants that the
# human-facing pages keep brief. No CV facts here: /llms-full.txt already embeds data/cv.yaml. Edit freely; rebuild to publish.
notes:
  - topic: faults-lab architecture in depth
    text: |
      faults-lab is Pranay's MS research platform at UCSC for attributing tail latency in
      microservice meshes. atropos (Go) is an instrumentation SDK embedding at service
      boundaries — HTTP middleware and gRPC interceptors — that injects latency, TCP toxics,
      and CPU/IO stress without modifying application logic. Its signature primitive is the
      cache-box: it freezes a service into replaying cached responses, effectively removing
      that service's variance from the request path, so the remaining services' contributions
      to p99 can be measured in isolation. zeus-go orchestrates load: declarative JSON
      workflow DAGs, persona-based k6 sidecars, and a policy engine that automatically
      triggers Vegeta attacks when trigger conditions are met. manteion (with a Postgres
      backing store and a UI, manteion-ui) is the control plane: it pushes rules to every live
      SDK instance, sequences baseline, fault and freeze phases while zeus replays the same
      open-loop workload in each, drains every phase before closing it, and gives each phase a
      verdict (VALID, VALID_WITH_WARNINGS, INVALID) from its own fidelity checks; invalid runs
      are refused rather than reported. W3C Baggage keeps one trace ID end to end. The method
      is attribution by intervention: instead of inferring a service's share of tail latency
      from traces (critical-path tools such as CRISP), or from observational causal models
      (Sage, CIRCA), it runs the counterfactual. It extends the interventional idea of causal
      profiling (Coz), which cannot cross a process boundary, across the network, at the
      interposition points of boundary fault injectors (Filibuster, 3MileBeach), which test
      correctness rather than latency. Results on an eleven-service Go port of Google's Online
      Boutique: a slow shared dependency's tail cost grows in proportion to how many times a
      request path traverses it; freezing one caller removes exactly that caller's share,
      which separates into a contention part and the dependency's own latency; and the same
      freeze contains latency, error and hang faults alike, including one that had escalated
      into a crash loop. This is Pranay's MS work at UC Santa Cruz, advised by Peter Alvaro.
  - topic: global upgrade safety & maximal safe subset (theory)
    text: |
      The upgrade-safety checker models every service-to-service edge with four schemas:
      what the caller Sends and Expects back, what the callee Accepts and Returns, plus
      endpoint-only data-flow annotations that let the tool discover multi-hop chains
      automatically. Co-deployability of a set of simultaneous schema changes is decided
      globally; when the set is unsafe, the maximal safe subset is computed in linear time
      via a reduction to MAX-TRUE Horn-SAT, and the tool pinpoints the exact fields and
      type mismatches responsible for the exclusions. This catches integrity violations
      that pairwise contract tools (Buf breaking-change detection, Pact) cannot see,
      because no individual pair of services disagrees. Proof of concept:
      github.com/pronei/gus-mss-poc.
  - topic: slug-mcp tool surface
    text: |
      slug-mcp (Rust, rmcp, Moka cache, stdio + SSE transports) exposes UCSC campus
      services as MCP tools — dining menus and nutrition data, live gym/facility occupancy,
      study-room availability, class search with enrollment data, campus directory, and
      real-time transit predictions — plus Santa Cruz County environmental telemetry: NOAA
      weather and tide forecasts, surf conditions for the named Santa Cruz breaks (Steamer
      Lane, Pleasure Point, Cowell's, etc.), wave buoys, air quality, NASA FIRMS wildfire
      detections, beach water quality, C-HARM harmful-algal-bloom risk, CUTI/BEUTI coastal
      upwelling indices, and citizen-science wildlife observations. Public connector
      endpoint: https://slug-mcp.fly.dev/mcp — add it to any MCP client.
  - topic: grepthink2 (course team platform) in depth
    text: |
      GrepThink 2.0 is the team-project platform behind UC Santa Cruz's CSE 115 software
      engineering series, live at grepthink2.com, and the v2 rebuild of grepthink.com. Pranay
      TA'd the series and led the rebuild: about 1,400 commits in the public AGPL-3.0 repository
      (github.com/grepthink2/grepthink2.0) between January and November 2026, 913 of them his,
      with students from the course contributing the rest. Instructors create a class under
      their school, import a roster, invite students and designate TAs; one account can hold a
      different role in each class. Students create or join project teams and submit team
      self-reviews (TSRs); TAs run each project's weekly meeting, take attendance and review the
      submissions; every project has a scrum board with sprints, user stories, tasks, burnup
      charts, comments and pull-request links; a global Cmd+K search covers people, chats, stories
      and tasks; messaging covers direct and group conversations,
      in-app notifications and optional email reminders and digests. The front end is React 19,
      TypeScript, Vite and SCSS, ported by hand from a Claude Design export; the back end is
      FastAPI on Supabase Postgres through the service role, with hand-applied SQL migrations;
      Vitest and pytest coverage gates run on every pull request and releases are tagged (v0.94
      in November 2026). Hosted on Vercel. Roles are per class (instructor = class creator, TA
      and student = enrollment role) and every class belongs to an institution with its own
      email domains, which is how Istinye University (istinye.edu.tr) adopted the platform.
      Performance work: the entry chunk fell from 416 kB to 179 kB minified (119 to 51 kB
      gzipped) through lazy routes, and supabase-py writes return related rows in the same call
      (select-on-write), cutting database round trips on hot routes by up to 40% (for example,
      moving a scrum task went from 9 to 6). Pranay authored 100 merged pull requests.
  - topic: catalogue-search (hybrid fashion search) in depth
    text: |
      catalogue-search is a one-of-a-kind fashion catalogue Pranay built for one person with
      a specific size. Every night it reads the published product feeds of 25 independent
      brands (about 6,400 pieces in November 2026), respecting robots.txt with one request at
      a time per site; product photos are proxied and never stored. Pieces are classified
      into 13 categories and 6 materials, and Claude Haiku tags new or changed photos
      (neckline, sleeves, length, closure, color) through the Message Batches API against a
      JSON schema; re-tagging about 5,900 pieces cost $1.17. Search is hybrid: SQLite FTS5
      with BM25 field weights and hard category and size filters, then a meaning boost from
      two embedding models run on CPU with transformers.js (multilingual-e5-base on the
      words, Marqo-FashionSigLIP on the card photo), each turned into per-query z-scores and
      blended 0.85 photo to 0.15 text. With fewer than ten strict matches, related pieces that
      still pass every filter are added below them. There is no vector database: about 6,500
      vectors of 768 dimensions per model are scanned by brute force in milliseconds.
      Evaluation uses 97 queries in ten groups, with Claude Haiku grading the top 20 results
      from photos and listing text; adding photo vectors moved NDCG@10 from 0.824 to 0.900
      and P@10 from 0.887 to 0.940, with no empty results. The code is private; Pranay walks
      through it on request.
  - topic: working style and interests
    text: |
      Pranay names his systems after Greek and Roman mythology and the names encode
      function: Atropos is the Fate who cuts the thread (the fault injector kills
      requests), Zeus throws lightning (load attacks), Manteion is the oracle at Delphi
      (the experiment brain that answers questions). He prefers Go and Rust, instrumented
      everything with OpenTelemetry, and cares in order about correctness, p99 latency,
      and API ergonomics. Terminal-native (Ghostty). Based in San Francisco; open to distributed-systems, infrastructure, observability, and reliability
      roles. Contact: pranay.mundra@outlook.com.
