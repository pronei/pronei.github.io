# Build and deploy to GitHub Pages.
#
# Triggers, and why there are four:
#   push               — you changed the site
#   schedule           — poll the project repos (GitHub API) so the status board tracks reality
#   repository_dispatch — a project repo pinged us on push (see docs/notify-portfolio.yml); instant
#   workflow_dispatch  — manual
#
# Gotcha this file is built around: GitHub silently DISABLES schedule triggers after 60 days
# without a commit to this repo (that froze the board in Aug 2026). So the "persist" step
# commits data/now.json back whenever it changed — real activity — and drops a keepalive
# commit if nothing has landed in 45 days. Bot pushes with GITHUB_TOKEN never retrigger
# this workflow, so there is no loop.
#
# Gates (a failure here stops the deploy): TypeScript type-check (Hugo's esbuild strips types
# without checking them), worker syntax, and a --panicOnWarning build — which is what turns
# the "background has no palette entry" warning into a hard failure.
# The lighthouse job is a separate, NON-gating budget check on pushes (lab perf is noisy on
# shared runners; a red X is the signal, the site still ships). Reports: workflow artifact.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [project-push]
  schedule:
    - cron: "17 */6 * * *"  # every 6h, offset from the :00 stampede

permissions:
  contents: write   # persist step commits data/now.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0
  TYPESCRIPT_VERSION: 7.0.2
  LHCI_VERSION: 0.15.1
  KEEPALIVE_DAYS: 45

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: install hugo (extended)
        run: |
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
      - uses: actions/checkout@v7
        with:
          persist-credentials: true   # needed for the persist step's push
      - id: pages
        uses: actions/configure-pages@v6

      - name: type-check (tsc)
        run: npx -y -p typescript@${TYPESCRIPT_VERSION} tsc -p .
      - name: worker syntax
        run: node --check workers/oracle/src/index.js

      - name: refresh status board from live repos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_now.py

      - name: persist status board (keeps the repo active; cron auto-disables after 60 idle days)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/now.json
          if ! git diff --cached --quiet; then
            git commit -m "status: board refresh from repo activity (${{ github.event_name }}) [skip ci]"
          else
            last=$(git log -1 --format=%ct)
            age=$(( ( $(date +%s) - last ) / 86400 ))
            if [ "$age" -ge "$KEEPALIVE_DAYS" ]; then
              git commit --allow-empty -m "chore: keepalive after ${age} idle days so the schedule stays enabled [skip ci]"
            else
              echo "board unchanged, last commit ${age}d ago (< ${KEEPALIVE_DAYS}) — nothing to persist"
              exit 0
            fi
          fi
          git pull --rebase --quiet origin main || true
          git push origin HEAD:main
        continue-on-error: true   # a push race must never block the deploy

      - name: build (strict — any Hugo warning fails)
        run: hugo --minify --panicOnWarning --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  lighthouse:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: install hugo (extended)
        run: |
          wget -qO /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
      - uses: actions/checkout@v7
      - name: build for a local static server
        run: hugo --minify --baseURL "http://localhost/"
      - name: lighthouse budgets (mobile, median of 3) — see lighthouserc.json
        run: npx -y @lhci/cli@${LHCI_VERSION} autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
